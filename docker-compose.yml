services:
  chess-coach:
    build:
      context: .
    container_name: chess-coach
    restart: unless-stopped

    network_mode: host

    env_file:
      - .env

    volumes:
      - ${CHESS_OUTPUT_DIR:-./chess_reviews}:/data

    command:
      [
        "--username", "${CHESS_USERNAME}",
        "--out", "/data",
        "--state-db", "/data/state.sqlite",
        "--provider", "ollama",
        "--ollama-url", "http://127.0.0.1:11434",
        "--ollama-model", "${OLLAMA_MODEL:-llama3.2:latest}",
        "--poll-seconds", "${POLL_SECONDS:-300}",
        "--update-index"
      ]