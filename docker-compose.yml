
services:
  postgres:
    image: postgres:16
    container_name: chess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chesscoach
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - chess_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  chess-coach:
    build:
      context: .
    container_name: chess-coach
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://chess:chess@postgres:5432/chesscoach}
      CHESS_OUTPUT_DIR: ${CHESS_OUTPUT_DIR:-/data}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/chess:/data

volumes:
  chess_postgres_data:
